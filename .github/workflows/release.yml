name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the tag matches package.json
        run: |
          node -e "const p = require('./package.json'); const tag = process.env.GITHUB_REF_NAME; if ('v' + p.version !== tag) { console.error('tag ' + tag + ' does not match package version v' + p.version); process.exit(1); }"

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build the package
        run: npm pack

      - name: Write checksums
        run: sha256sum ./*.tgz > SHA256SUMS.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.tgz SHA256SUMS.txt --clobber
          else
            gh release create "$tag" ./*.tgz SHA256SUMS.txt \
              --title "$tag" --generate-notes --verify-tag
          fi
